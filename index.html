  :root{
    --bg:#f2f8ee;
    --leaf-1:#a9d8a4;
    --leaf-2:#7bc588;
    --leaf-3:#4f9d6e;
    --leaf-deep:#2f6b47;
    --cream:#fffdf6;
    --sun:#ffd76b;
    --ink:#2c3b2e;
    --muted:#6b7d6a;
    --surface:#ffffff;
    --panel:#f6fbf3;
    --fine-bg:#fff7e0;
    --bg-image:none;
    --radius:22px;
    --shadow: 0 8px 24px rgba(47,107,71,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'AppFont', sans-serif;
    background-color:var(--bg);
    background-image:var(--bg-image);
    background-attachment:fixed;
    color:var(--ink);
    overflow-x:hidden;
  }
  .hidden{display:none !important;}

  /* organic paint-splash background — tinted per active theme */
  .bg-splash{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(circle at 8% 12%, color-mix(in srgb, var(--leaf-3) 55%, transparent) 0%, transparent 40%),
      radial-gradient(circle at 92% 18%, color-mix(in srgb, var(--leaf-2) 45%, transparent) 0%, transparent 38%),
      radial-gradient(circle at 15% 85%, color-mix(in srgb, var(--sun) 35%, transparent) 0%, transparent 32%),
      radial-gradient(circle at 88% 82%, color-mix(in srgb, var(--leaf-1) 30%, transparent) 0%, transparent 42%);
    filter: blur(6px);
  }

  .app{position:relative; z-index:1; max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

  /* وقتی کاربر «حذف کلی طیف رنگ» را می‌زند، پس‌زمینه باید کاملاً سفید و خالی شود — بدون هیچ لکه‌ی رنگی تزئینی */
  body.bg-fully-cleared .bg-splash,
  body.custom-gradient-active .bg-splash,
  body.gradient-draft-active .bg-splash{ display:none !important; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px; position:sticky; top:0; z-index:5;
    background:var(--bg); background:color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter:blur(8px);
    border-bottom:2px solid var(--leaf-1);
  }
  .brand{font-weight:800; font-size:20px; color:var(--leaf-deep); display:flex; gap:6px; align-items:center;}
  .xp-pill{
    background:var(--sun); color:#5a4300; font-weight:700; padding:6px 14px;
    border-radius:999px; font-size:13px; box-shadow:var(--shadow);
  }
  .xp-pill.small{padding:4px 10px; font-size:12px;}

  .view{flex:1; padding:16px 16px 100px; position:relative; z-index:1;}

  .card{
    background:var(--cream); border-radius:var(--radius); padding:20px;
    margin-bottom:16px; box-shadow:var(--shadow);
    border:3px solid var(--leaf-1);
    position:relative;
  }
  .card h2{margin:0 0 4px; color:var(--leaf-deep); font-size:20px;}
  .card h3, .card h4{color:var(--leaf-deep); margin:14px 0 8px;}
  .muted{color:var(--muted);}
  .small{font-size:12px;}
  .fine{font-size:12px; color:var(--muted); background:var(--fine-bg); border-radius:10px; padding:6px 10px; margin:8px 0;}
  .empty{color:var(--muted); text-align:center; padding:20px 0;}

  /* پیش‌نمایش آزمایشی طیف رنگ: صفحه‌ی سفید پشت برنامه (هدر و نوار پایین) موقتاً حذف می‌شود */
  body.gradient-preview-hide-chrome .topbar,
  body.gradient-preview-hide-chrome .tabbar{ display:none !important; }
  body.gradient-preview-hide-chrome .view{ padding-top:16px; }

  input, select{
    font-family:inherit; border:2px solid var(--leaf-1); border-radius:14px;
    padding:10px 14px; font-size:14px; background:var(--surface); color:var(--ink); flex:1;
    outline:none; transition:border-color .15s;
  }
  input:focus{border-color:var(--leaf-3);}

  .btn-primary{
    background:linear-gradient(135deg, var(--leaf-3), var(--leaf-deep));
    color:#fff; border:none; border-radius:14px; padding:10px 18px;

/* =========================================================
   HOOSH GIAH — هوش گیاهی
   Client-side MVP demo of the full ecosystem described in the brief.
   NOTE: True image/voice plant recognition, millions-of-users scale,
   real auth/cloud sync, and IoT sensor ingestion require a real backend
   (vision model API, database, message queue, auth service). This file
   simulates all of that behavior in-memory/localStorage-free so the
   whole product experience can be demoed from three static files.
   ========================================================= */

const State = {
  db: null,               // loaded from data.json
  user: null,             // current mock-logged-in user
  myPlants: [],           // { uid, plantId, nickname, folder, isPublic, addedAt, lastWatered }
  notifications: [],      // { id, plantUid, type, dueAt, done }
  posts: [],              // community feed
  cart: [],
  xp: 0,
  view: "auth",
  pendingIdentify: null,  // holds partial AI identification state
  toastTimer: null,
};

const CARE_LABELS = {
  watering: { label: "آبیاری", icon: "drop" },
  fertilizing: { label: "کوددهی", icon: "flask" },
  relocation: { label: "جابجایی", icon: "plant" },
  repotting: { label: "تعویض گلدان", icon: "plant" },
};

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const uid = (p = "id") => `${p}_${Math.random().toString(36).slice(2, 9)}`;

/* ---------------- PWA INSTALL ---------------- */
let deferredInstallPrompt = null;
let installPromptShownThisSession = false;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
});
window.addEventListener("appinstalled", () => {
  deferredInstallPrompt = null;
  try { localStorage.setItem("hooshGiah.installed", "1"); } catch (e) {}
});

function maybeShowInstallPrompt() {
  if (installPromptShownThisSession) return;
  // اگر قبلاً نصب شده یا در حالت standalone باز شده، دیگر نپرس
  const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  let alreadyInstalled = false;
  try { alreadyInstalled = localStorage.getItem("hooshGiah.installed") === "1"; } catch (e) {}
  if (isStandalone || alreadyInstalled) return;

  installPromptShownThisSession = true;
  // کمی صبر می‌کنیم تا رویداد beforeinstallprompt مرورگر برسد (در صورت پشتیبانی)
  setTimeout(() => {
    const sheet = $("#installPrompt");
    if (!sheet) return;
    sheet.classList.remove("hidden");
  }, 900);
}

function wireInstallPrompt() {
  const sheet = $("#installPrompt");
  if (!sheet) return;
  $("#btnInstallYes").onclick = async () => {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      const choice = await deferredInstallPrompt.userChoice.catch(() => null);
      deferredInstallPrompt = null;
      if (choice && choice.outcome === "accepted") {
        toast("در حال نصب برنامه...");
      } else {
        toast("می‌توانید بعداً از منوی مرورگر نصب کنید");
      }
    } else {
      // مرورگرهایی مثل iOS Safari از beforeinstallprompt پشتیبانی نمی‌کنند
      toast("برای نصب: منوی مرورگر ← افزودن به صفحه اصلی");
    }
    sheet.classList.add("hidden");
  };
  $("#btnInstallNo").onclick = () => {
    sheet.classList.add("hidden");
  };
}

/* ---------------- Boot ---------------- */
async function boot() {
  applyTheme(localStorage.getItem("hooshGiah.theme") || "default");
  applyCustomPersonalization();
  applyAdvancedPersonalization();
  State.db = EMBEDDED_DATA;
  await NotifEngine.init();
  loadPersisted();
  seedCommunity();
  renderShell();
  if (State.user) {
    $("#authScreen").classList.add("hidden");
    $("#app").classList.remove("hidden");
    gainXp(0);
    goto("ai");
    maybeShowInstallPrompt();
    maybeAskNotificationPermission();
  } else {
    goto("auth");
  }
  setInterval(checkDueNotifications, 20000); // بررسی دوره‌ای یادآورهای سررسیدشده
  checkDueNotifications();
}

/* ---------------- PERSISTENCE (localStorage) ----------------
   بدون این بخش، با هر رفرش صفحه گیاهان، یادآورها، امتیاز XP و ورود کاربر
   پاک می‌شد و یادآورهای زمان‌بندی‌شده هرگز فرصت سررسید شدن پیدا نمی‌کردند. */
const STORAGE_KEY = "hooshGiah.state.v1";

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      user: State.user,
      myPlants: State.myPlants,
      notifications: State.notifications,
      xp: State.xp,
      aiPlants: State.db.plants.filter((p) => p.id.startsWith("ai_")),
      users: State.db.users,
      marketplace: State.db.marketplace,
      posts: State.posts,
    }));
  } catch (e) { /* حالت خصوصی مرورگر یا ظرفیت پر — نادیده گرفته می‌شود */ }
}

function loadPersisted() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved.user) State.user = saved.user;
    if (Array.isArray(saved.myPlants)) State.myPlants = saved.myPlants;
    if (Array.isArray(saved.notifications)) State.notifications = saved.notifications;
    if (typeof saved.xp === "number") State.xp = saved.xp;
    if (Array.isArray(saved.aiPlants)) {
      saved.aiPlants.forEach((p) => {
        if (!State.db.plants.find((x) => x.id === p.id)) State.db.plants.push(p);
      });
    }
  } catch (e) { /* داده خراب — نادیده گرفته می‌شود */ }
}

/* ---------------- SYSTEM / PUSH NOTIFICATIONS ---------------- */
const NotifEngine = {
  supported: "Notification" in window,
  swReady: null, // Promise<ServiceWorkerRegistration> | null
  get permission() { return this.supported ? Notification.permission : "unsupported"; },
  async init() {
    if (!("serviceWorker" in navigator)) {
      console.warn("این مرورگر از Service Worker پشتیبانی نمی‌کند — اعلان‌های سیستمی واقعی کار نخواهند کرد.");
      return;
    }
    try {
      // از URL مطلق نسبت به همین صفحه استفاده می‌کنیم تا مسیر همیشه درست حل شود
      const swUrl = new URL("sw.js", document.baseURI).href;
      const reg = await navigator.serviceWorker.register(swUrl);
      // منتظر می‌مانیم که واقعاً فعال (active) شود، نه فقط ثبت شود
      if (reg.installing) {
        await new Promise((resolve) => {
          reg.installing.addEventListener("statechange", function onChange(e) {
            if (e.target.state === "activated" || e.target.state === "redundant") {
              e.target.removeEventListener("statechange", onChange);
              resolve();
            }
          });
        });
      }
      await navigator.serviceWorker.ready;
      this.swReady = Promise.resolve(reg);
    } catch (e) {
      console.warn("SW registration failed — سرویس‌ورکر ثبت نشد:", e);
      this.swReady = null;
    }
  },
  async requestPermission() {
    if (!this.supported) { toast("این مرورگر از اعلان‌ها پشتیبانی نمی‌کند"); return "unsupported"; }
    if (Notification.permission === "granted") return "granted";
    const res = await Notification.requestPermission();
    if (res === "granted") toast("اعلان‌ها فعال شدند");
    else if (res === "denied") toast("اعلان‌ها مسدود شدند — از تنظیمات مرورگر می‌توانید تغییر دهید");
    if (State.view === "notifications") renderNotifications();
    return res;
  },
  async fire(title, body, tag) {
    if (!(this.supported && Notification.permission === "granted")) {
      toast(`${title} — ${body}`);
      return;
    }

    if (!this.swReady && "serviceWorker" in navigator) {

let notifAskedThisSession = false;
function maybeAskNotificationPermission() {
  if (notifAskedThisSession) return;
  if (!NotifEngine.supported) return;
  if (Notification.permission !== "default") return; // قبلاً تصمیم‌گیری شده
  notifAskedThisSession = true;
  // کمی بعد از باز شدن برنامه بپرس، تا با پرسش نصب برنامه تداخل نداشته باشد
  setTimeout(() => { NotifEngine.requestPermission(); }, 2200);
}

function checkDueNotifications() {
  const now = Date.now();
  let fired = false;
  State.notifications.forEach((n) => {
    if (!n.done && !n.notified && n.dueAt <= now) {
      n.notified = true;
      fired = true;
      const label = CARE_LABELS[n.type]?.label || n.type;
      NotifEngine.fire(`یادآور ${label}`, `وقت مراقبت از «${n.plantName}» رسیده!`, n.id);
    }
  });
  if (fired) {
    persist();
    if (State.view === "notifications") renderNotifications();
  }
}

const AI_CONFIG = {
  // آدرس API سرویس OpenRouter (فرمت سازگار با OpenAI)
  baseUrl: "https://openrouter.ai/api/v1",
  // نکته امنیتی: هرگز کلید API واقعی‌ات رو اینجا هاردکد نکن — این فایل روی مرورگر
  // کاربر لود می‌شه و هرکسی می‌تونه با «مشاهده منبع صفحه» کلیدت رو ببینه و مصرفش کنه.
  // برای تست این نسخه، کلید فعلی در همین فایل قرار دارد. برای انتشار عمومی حتماً آن را حذف و از بک‌اند/پروکسی امن استفاده کن.
  defaultApiKey: "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",
  textModel: "openrouter/free",
  visionModel: "openrouter/free",
};

function getAiApiKey() {
  return AI_CONFIG.defaultApiKey;
}

// از روی کد وضعیت و متن خطای برگشتی از گوگل، یک پیام فارسیِ قابل‌فهم برای کاربر می‌سازه
function friendlyAiErrorMessage(status, rawText, usedKey) {
  const text = rawText || "";
  const isAuthError = status === 401 || status === 403 ||
    /ACCESS_TOKEN_TYPE_UNSUPPORTED|API key not valid|API_KEY_INVALID|PERMISSION_DENIED/i.test(text);

  if (isAuthError) return "کلید API نامعتبر یا غیرفعاله. از تنظیمات ⟵ هوش مصنوعی یک کلید معتبر OpenRouter وارد کن.";
  if (status === 404) return "مدل هوش مصنوعی در دسترس نیست یا نامش تغییر کرده — کمی بعد دوباره امتحان کن.";
  if (status === 429) return "درخواست‌های زیادی پشت سر هم ارسال شده — چند لحظه صبر کن و دوباره امتحان کن.";
  if (status >= 500) return "سرویس هوش مصنوعی موقتاً در دسترس نیست — کمی بعد دوباره امتحان کن.";
  return "ارتباط با سرویس هوش مصنوعی برقرار نشد.";
}

async function aiChatCompletion(messages) {
  // OpenRouter از فرمت OpenAI (role: system/user/assistant) استفاده می‌کنه، پس
  // پیام‌ها مستقیم قابل استفاده‌ان و نیازی به تبدیل ساختار نیست.
  const body = {
    model: AI_CONFIG.textModel,
    messages,
    temperature: 0.4,
  };

  const apiKey = getAiApiKey();
  if (!apiKey) throw new Error("هیچ کلید API ثبت نشده. از تنظیمات ⟵ هوش مصنوعی یک کلید OpenRouter وارد کن.");

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 15000);
  const targetUrl = `${AI_CONFIG.baseUrl}/chat/completions`;
  let res;
  try {
    res = await fetch(targetUrl, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${apiKey}`,
        "HTTP-Referer": location.href,
        "X-Title": "هوش گیاهی",
      },
      body: JSON.stringify(body),
      signal: controller.signal,
    });
  } catch (e) {
    if (e.name === "AbortError") throw new Error(`Timeout پس از ۱۵ ثانیه. آدرس: ${targetUrl}`);
    throw new Error(`اتصال شبکه ناموفق (fetch). آدرس: ${targetUrl} — پیام مرورگر: ${e.message || e.name || e}`);
  } finally {
    clearTimeout(timeoutId);
  }
  if (!res.ok) {
    const errText = await res.text().catch(() => "");
    throw new Error(friendlyAiErrorMessage(res.status, errText, apiKey));
  }
  const data = await res.json();
  return data.choices?.[0]?.message?.content?.trim() || "";
}

async function aiVisionIdentify(imageDataUrl) {
  const systemPrompt = [
    "تو یک متخصص گیاه‌شناسی و کشاورزی هستی که تصویر یک گیاه، میوه، سبزی یا درخت را می‌بینی و باید آن را دقیق شناسایی کنی.",
    "به‌دقت به شکل برگ، رنگ، بافت پوست، شکل میوه یا گل در تصویر نگاه کن و نوع دقیق را تشخیص بده — هرگز حدس تصادفی نزن و هرگز صرفاً یک گیاه رایج و متداول (مثل پوتوس) را به‌عنوان پاسخ پیش‌فرض ننویس مگر اینکه واقعاً همان باشد.",
    "اگر تصویر یک میوه است (مثل انار، سیب، پرتقال)، نام همان میوه و درختش را بنویس، نه یک گیاه آپارتمانی نامرتبط.",
    "اگر مطمئن نیستی یا تصویر واضح نیست، این را با عدد confidence پایین (زیر 50) نشان بده، نه با انتخاب یک گیاه دلخواه.",
    "فقط و فقط یک شیء JSON خام برگردان، بدون ```json و بدون هیچ توضیح اضافه، دقیقاً با این کلیدها:",
    '{"name_fa": string (نام فارسی دقیق گیاه/میوه شناسایی‌شده), "latin": string (نام علمی لاتین), "confidence": number (0 تا 100), "watering": string, "fertilizing": string, "sunlight": string, "soil": string, "temperature": string, "humidity": string, "diseases": string (چند مورد، جدا شده با ویرگول فارسی «،»), "seasonal": string}',
    "تمام مقادیر متنی باید به زبان فارسی باشند."
  ].join("\n");

  // فرمت OpenRouter/OpenAI برای تصویر: image_url با یک data URL کامل (نیازی به جدا کردن mime/base64 نیست)
  const body = {
    model: AI_CONFIG.visionModel,
    messages: [
      { role: "system", content: systemPrompt },
      {
        role: "user",
        content: [
          { type: "text", text: "این تصویر چه گیاه یا میوه‌ای است؟ دقیقاً طبق فرمت JSON خواسته‌شده و فقط بر اساس چیزی که واقعاً در عکس می‌بینی پاسخ بده." },
          { type: "image_url", image_url: { url: imageDataUrl } },
        ],
      },
    ],
    temperature: 0.1,
    max_tokens: 900,
  };

  const apiKey = getAiApiKey();
  if (!apiKey) throw new Error("هیچ کلید API ثبت نشده. از تنظیمات ⟵ هوش مصنوعی یک کلید OpenRouter وارد کن.");

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 25000);
  let res;
  try {
    res = await fetch(`${AI_CONFIG.baseUrl}/chat/completions`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${apiKey}`,
        "HTTP-Referer": location.href,
        "X-Title": "هوش گیاهی",
      },
      body: JSON.stringify(body),
      signal: controller.signal,
    });
  } catch (e) {
    if (e.name === "AbortError") throw new Error("پاسخی از سرویس هوش مصنوعی دریافت نشد (اتصال شبکه کند یا قطع است).");
    throw new Error("اتصال به اینترنت برقرار نشد.");
  } finally {
    clearTimeout(timeoutId);
  }
  if (!res.ok) {
    const errText = await res.text().catch(() => "");
    throw new Error(friendlyAiErrorMessage(res.status, errText, apiKey));
  }
  const data = await res.json();
  let raw = (data.choices?.[0]?.message?.content || "").trim();
  if (!raw) throw new Error("سرویس هوش مصنوعی پاسخ خالی برگرداند — دوباره امتحان کن.");
  // مدل گاهی JSON را داخل ```json ... ``` می‌گذارد یا متن اضافه قبل/بعدش می‌نویسد —
  // اولین بلوک { ... } معتبر را استخراج می‌کنیم
  raw = raw.replace(/^```json\s*/i, "").replace(/^```\s*/i, "").replace(/```\s*$/i, "").trim();
  const firstBrace = raw.indexOf("{");
  const lastBrace = raw.lastIndexOf("}");
  if (firstBrace === -1 || lastBrace === -1) throw new Error("پاسخ سرویس هوش مصنوعی قابل‌پردازش نبود — دوباره امتحان کن.");
  const jsonSlice = raw.slice(firstBrace, lastBrace + 1);
  let parsed;
  try {
    parsed = JSON.parse(jsonSlice);
  } catch (e) {
    throw new Error("پاسخ سرویس هوش مصنوعی قابل‌پردازش نبود — دوباره امتحان کن.");
  }
  return parsed;
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// عکس‌های گوشی معمولاً خیلی بزرگ هستند (چند مگابایت) — قبل از ارسال به API
// آن را به حداکثر ۱۲۸۰ پیکسل کوچک می‌کنیم تا هم سریع‌تر باشد و هم رد نشود
function downscaleImage(dataUrl, maxSize = 1280) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width <= maxSize && height <= maxSize) { resolve(dataUrl); return; }
      const scale = maxSize / Math.max(width, height);
      width = Math.round(width * scale);
      height = Math.round(height * scale);
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

}

/* Custom modal helpers — window.prompt()/confirm() are unreliable (often silently
   no-op) inside installed/standalone PWAs on iOS and some Android browsers, which
   was breaking admin login and logout. These DOM-based replacements always work. */
function showModal({ title, message, input, confirmLabel, cancelLabel }) {
  return new Promise((resolve) => {
    const wrap = document.createElement("div");
    wrap.className = "modal-overlay";
    wrap.innerHTML = `
      <div class="modal-card">
        ${title ? `<h3>${title}</h3>` : ""}
        ${message ? `<p class="muted small">${message}</p>` : ""}
        ${input ? `<input type="${input.type || "text"}" class="modal-input" placeholder="${input.placeholder || ""}" autocomplete="off" />` : ""}
        <div class="modal-actions">
          <button class="btn-primary modal-ok">${confirmLabel || "تایید"}</button>
          <button class="btn-mini modal-cancel">${cancelLabel || "انصراف"}</button>
        </div>
      </div>`;
    document.body.appendChild(wrap);
    const inputEl = wrap.querySelector(".modal-input");
    if (inputEl) setTimeout(() => inputEl.focus(), 30);
    const close = (val) => { wrap.remove(); resolve(val); };
    wrap.querySelector(".modal-ok").onclick = () => close(input ? (inputEl.value || "") : true);
    wrap.querySelector(".modal-cancel").onclick = () => close(null);
    wrap.addEventListener("click", (e) => { if (e.target === wrap) close(null); });
    if (inputEl) inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") close(inputEl.value || ""); });
  });
}
async function askConfirm(message, title) {
  return !!(await showModal({ title, message, confirmLabel: "بله", cancelLabel: "انصراف" }));
}

  $("#fileChatImg").onchange = () => runChatImage();
  $("#btnVoice").onclick = () => {
    toast("حالت نمایشی: فرض می‌کنیم گفتی «برگ پهن با سوراخ»");
    $("#chatText").value = "برگ پهن با سوراخ";
    runChat();

}

async function runChatImage() {
  const fileInput = $("#fileChatImg");
  const file = fileInput.files && fileInput.files[0];
  if (!file) return;
  const log = $("#chatLog");
  try {
    const rawDataUrl = await fileToDataUrl(file);
    const dataUrl = await downscaleImage(rawDataUrl).catch(() => rawDataUrl);
    log.insertAdjacentHTML("beforeend", `<div class="msg me"><img src="${dataUrl}" alt="عکس گیاه" style="max-width:160px;border-radius:12px;display:block;" /></div>`);
    log.scrollTop = log.scrollHeight;
    log.insertAdjacentHTML("beforeend", `<div class="msg ai" id="chatImgPending">${ic("search")} در حال شناسایی گیاه از روی عکس...</div>`);
    log.scrollTop = log.scrollHeight;

    const result = await aiVisionIdentify(dataUrl);
    const confidence = Math.max(0, Math.min(100, Math.round(Number(result.confidence) || 0)));
    const pending = $("#chatImgPending");
    if (pending) pending.remove();

    const diseases = (result.diseases || "").split(/[،,]/).map((s) => s.trim()).filter(Boolean).join("، ");
    const name = result.name_fa || "گیاه ناشناخته";
    const summary = [
      `<b>${escapeHtml(name)}</b>${result.latin ? ` <i>(${escapeHtml(result.latin)})</i>` : ""} — اطمینان ${confidence}٪`,
      `${ic("drop")} آبیاری: ${escapeHtml(result.watering || "نامشخص")}`,
      `${ic("flask")} کوددهی: ${escapeHtml(result.fertilizing || "نامشخص")}`,
      `${ic("sun")} نور: ${escapeHtml(result.sunlight || "نامشخص")}`,
      diseases ? `<b>بیماری‌های رایج:</b> ${escapeHtml(diseases)}` : "",
    ].filter(Boolean).join("<br>");
    log.insertAdjacentHTML("beforeend", `<div class="msg ai">${summary}</div>`);

    const plant = {
      id: "ai_" + uid(),
      name,
      latin: result.latin || "",
      image: "leaf",
      care: {
        watering: result.watering || "نامشخص",
        fertilizing: result.fertilizing || "نامشخص",
        sunlight: result.sunlight || "نامشخص",
        soil: result.soil || "نامشخص",
        temperature: result.temperature || "نامشخص",
        humidity: result.humidity || "نامشخص",
        diseases: (result.diseases || "").split(/[،,]/).map((s) => s.trim()).filter(Boolean),
        seasonal: result.seasonal || "",
        schedule: ["watering:7", "fertilizing:28"],
      },
    };
    log.insertAdjacentHTML("beforeend", `<div class="msg ai"><button class="btn-mini" id="btnAddPlantChat">${ic("plus")} افزودن به گیاهان من</button></div>`);
    const addBtn = $("#btnAddPlantChat");
    if (addBtn) addBtn.onclick = () => addMyPlant(plant);
  } catch (e) {
    console.warn("AI vision identify failed:", e);
    const pending = $("#chatImgPending");
    if (pending) pending.remove();
    log.insertAdjacentHTML("beforeend", `<div class="msg ai">${ic("warning")} ${escapeHtml(e.message || "ارتباط با سرویس هوش مصنوعی برقرار نشد.")}</div>`);
  }
  log.scrollTop = log.scrollHeight;
  fileInput.value = "";
}

async function runChat() {
  const input = $("#chatText");
  const text = input.value.trim();
  if (!text) return;
  const log = $("#chatLog");
  log.insertAdjacentHTML("beforeend", `<div class="msg me">${escapeHtml(text)}</div>`);
  input.value = "";
  log.scrollTop = log.scrollHeight;
  log.insertAdjacentHTML("beforeend", `<div class="msg ai" id="chatPending">در حال فکر کردن...</div>`);
  log.scrollTop = log.scrollHeight;

  try {
    const reply = await aiChatCompletion([
      { role: "system", content: "تو یک دستیار متخصص نگهداری گیاهان خانگی هستی. همیشه به زبان فارسی، کوتاه، دوستانه و کاربردی پاسخ بده." },
      { role: "user", content: text },
    ]);
    const pending = $("#chatPending");
    if (pending) pending.remove();
    log.insertAdjacentHTML("beforeend", `<div class="msg ai">${escapeHtml(reply || mockPlantAnswer(text))}</div>`);
  } catch (e) {
    console.warn("AI chat failed, falling back to local knowledge base:", e);
    const pending = $("#chatPending");
    if (pending) pending.remove();
    log.insertAdjacentHTML("beforeend", `<div class="msg ai">${mockPlantAnswer(text)}<div class="muted small" style="margin-top:6px;">${ic("warning")} ${escapeHtml(e.message || "اتصال به هوش مصنوعی برقرار نشد")} — این پاسخ از پایگاه‌دانش محلی برنامه است. <a href="#" id="chatGoAiSettings" style="color:inherit; text-decoration:underline;">تنظیمات هوش مصنوعی</a></div></div>`);
    const goSettingsLink = $("#chatGoAiSettings");
    if (goSettingsLink) goSettingsLink.onclick = (ev) => { ev.preventDefault(); State.settingsView = "ai"; goto("settings"); };
  }
  log.scrollTop = log.scrollHeight;
}

// دستیار محلی مبتنی بر پایگاه‌دانش گیاهان — بدون نیاز به کلید API یا سرور خارجی،
// همیشه در دسترس و امن (هیچ داده‌ای به بیرون ارسال نمی‌شود).
function mockPlantAnswer(text) {
  const t = text.toLowerCase();
  const hit = State.db.plants.find((p) => p.keywords.some((k) => t.includes(k.toLowerCase())));

  if (hit) {
    const c = hit.care;
    if (t.includes("آبیاری") || t.includes("آب")) return `${hit.name}: ${c.watering}`;
    if (t.includes("نور") || t.includes("آفتاب")) return `${hit.name}: ${c.sunlight}`;
    if (t.includes("کود")) return `${hit.name}: ${c.fertilizing}`;
    if (t.includes("خاک")) return `${hit.name}: ${c.soil}`;
    if (t.includes("بیماری") || t.includes("مریض") || t.includes("لکه")) return `مشکلات رایج ${hit.name}: ${c.diseases.join("، ")}`;
    if (t.includes("زمستان") || t.includes("فصل")) return `نکته فصلی ${hit.name}: ${c.seasonal}`;
    return `درباره ${hit.name}: ${c.watering} همچنین ${c.sunlight} نیاز داره. برای جزئیات بیشتر بپرس (آبیاری، نور، کود، خاک، بیماری).`;
  }

  if (t.includes("زرد")) return "زرد شدن برگ معمولاً به‌خاطر آبیاری زیاد، نور نامناسب یا کمبود مواد غذایی است — اول رطوبت خاک رو چک کن.";
  if (t.includes("قهوه") || t.includes("سوخت")) return "قهوه‌ای یا سوختگی لبه برگ معمولاً از نور مستقیم شدید، هوای خشک یا کمبود آب میاد.";
  if (t.includes("آبیاری")) return "بیشتر گیاهان آپارتمانی وقتی چند سانتی‌متر بالای خاک خشک شد نیاز به آب دارن. بهتره قبل از آبیاری با انگشت خاک رو چک کنی.";
  if (t.includes("پوسیدگی") || t.includes("ریشه")) return "پوسیدگی ریشه معمولاً از آبیاری زیاد و زهکش ضعیف گلدون میاد — گلدون رو با خاک تازه و زهکش خوب عوض کن.";
  if (t.includes("حشره") || t.includes("آفت") || t.includes("شپشک")) return "برای آفت‌های رایج مثل شپشک آرد، برگ‌ها رو با پارچه مرطوب یا محلول آب‌وصابون تمیز کن و گیاه رو موقتاً از بقیه جدا نگه دار.";

  return "می‌تونی اسم گیاهت رو بگی یا دقیق‌تر بپرسی (مثلاً آبیاری، نور، کود، خاک یا بیماری) تا راهنمایی دقیق‌تری بدم";
}

function escapeHtml(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

/* ---------------- MY PLANTS ---------------- */
function addMyPlant(plant) {
  // اگر این گیاه از هوش مصنوعی اومده و در پایگاه‌داده محلی نیست، اضافه‌اش می‌کنیم
  // تا بعداً در «گیاهان من» بشه جزئیاتش رو پیدا کرد
  if (!State.db.plants.find((p) => p.id === plant.id)) {
    State.db.plants.push(plant);
  }
  const mp = {
    uid: uid("mp"),
    plantId: plant.id,
    nickname: plant.name,
    folder: "",
    isPublic: false,
    addedAt: Date.now(),
  };
  State.myPlants.push(mp);
  scheduleNotifications(mp, plant);
  persist();
  toast(`${plant.name} به گیاهان من اضافه شد`);
  goto("myplants");
}

function scheduleNotifications(mp, plant) {
  (plant.care.schedule || []).forEach((rule) => {
    const [type, days] = rule.split(":");
    State.notifications.push({
      id: uid("notif"),
      plantUid: mp.uid,
      plantName: mp.nickname,
      type,
      dueAt: Date.now() + Number(days) * 24 * 3600e3,
      done: false,
      notified: false,
    });
  });
}

function renderMyPlants() {
  const el = $("#view");
  const plantOf = (mp) => State.db.plants.find((p) => p.id === mp.plantId);
  const folders = Array.from(new Set(State.myPlants.map((p) => p.folder).filter(Boolean))).sort();
  const grouped = folders.length
    ? folders.map((f) => ({ f, items: State.myPlants.filter((p) => p.folder === f) }))
    : [{ f: "همه گیاهان (مرتب‌شده الفبایی)", items: [...State.myPlants].sort((a, b) => a.nickname.localeCompare(b.nickname, "fa")) }];

  el.innerHTML = `
    <section class="card">
      <h2>${ic("plant")} گیاهان من</h2>
      <p class="muted">${State.myPlants.length} گیاه — پیش‌فرض همه خصوصی هستند ${ic("lock")}</p>
      ${State.myPlants.length === 0 ? `<p class="empty">هنوز گیاهی اضافه نکردی. از تب «دستیار هوش مصنوعی» گیاهت رو شناسایی و اضافه کن.</p>` : ""}
      ${grouped.map((g) => `
        <h4>${g.f}</h4>
        <div class="plant-list">
          ${g.items.map((mp) => {
            const plant = plantOf(mp);
            return `
            <div class="plant-row" data-uid="${mp.uid}">
              <span class="plant-emoji">${ic(plant.image, "lg")}</span>
              <div class="plant-row-info">
                <b>${mp.nickname}</b>
                <span class="muted small">${plant.latin}</span>
              </div>
              <label class="switch">
                <input type="checkbox" class="pub-toggle" data-uid="${mp.uid}" ${mp.isPublic ? "checked" : ""}/>
                <span>${mp.isPublic ? ic("globe") + " عمومی" : ic("lock") + " خصوصی"}</span>
              </label>
            </div>`;
          }).join("")}
        </div>
      `).join("")}

  `;
  $$(".pub-toggle").forEach((cb) => cb.onchange = () => {
    const mp = State.myPlants.find((p) => p.uid === cb.dataset.uid);
    mp.isPublic = cb.checked;
    persist();

    renderMyPlants();
  });
}

/* ---------------- NOTIFICATIONS ---------------- */
function renderNotifications() {
  const el = $("#view");
  const pending = State.notifications.filter((n) => !n.done).sort((a, b) => a.dueAt - b.dueAt);
  const done = State.notifications.filter((n) => n.done);
  const perm = NotifEngine.permission;
  const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const installHint = (!isStandalone && isIOS)
    ? `<div class="fine">${ic("phone")} برای دریافت اعلان‌های واقعی روی آیفون، باید این سایت را از منوی Safari با گزینه «Add to Home Screen» نصب کنی و از همون آیکون روی صفحه اصلی بازش کنی.</div>`
    : (!isStandalone ? `<div class="fine">${ic("phone")} برای اطمینان از دریافت اعلان‌ها حتی زمانی که تب بسته است، پیشنهاد می‌شود برنامه را نصب کنی (منوی مرورگر → Add to Home screen / Install app).</div>` : "");
  const permBanner = perm === "granted"
    ? `<div class="fine">${ic("bell")} اعلان‌های سیستم فعال است — وقتی یادآوری سررسید شود، پیام دریافت می‌کنی.</div>${installHint}`
    : perm === "denied"
      ? `<div class="fine">${ic("warning")} اعلان‌ها در مرورگر مسدود شده‌اند. برای فعال‌سازی از تنظیمات سایت در مرورگر اجازه بده.</div>`
      : `<div class="ai-input-row"><button class="btn-primary" id="btnEnableNotif">${ic("bell")} فعال‌سازی اعلان‌ها</button></div>${installHint}`;
  el.innerHTML = `
    <section class="card">
      <h2>${ic("bell")} یادآورهای مراقبت</h2>
      ${permBanner}
      ${pending.length === 0 ? `<p class="empty">${ic("leaf")} یادآور فعالی نداری</p>` : ""}
      <div class="notif-list">
        ${pending.map((n) => `
          <div class="notif-row">
            <span>${ic(CARE_LABELS[n.type]?.icon || "bell")} <b>${CARE_LABELS[n.type]?.label || n.type}</b> — ${n.plantName}</span>
            <span class="muted small">${new Date(n.dueAt).toLocaleDateString("fa-IR")}</span>
            <div class="notif-actions">
              <button class="btn-mini done" data-id="${n.id}">${ic("check")} انجام شد</button>
              <button class="btn-mini later" data-id="${n.id}">⏰ بعداً</button>
            </div>
          </div>`).join("")}
      </div>
      ${done.length ? `<h4>انجام‌شده‌ها</h4><p class="muted small">${done.length} یادآور تکمیل شده</p>` : ""}
      <button class="btn-mini" id="btnTestNotif">${ic("flask")} ارسال یک پیام آزمایشی</button>
    </section>
  `;
  $$(".btn-mini.done").forEach((b) => b.onclick = () => completeNotification(b.dataset.id));
  $$(".btn-mini.later").forEach((b) => b.onclick = () => {
    const n = State.notifications.find((x) => x.id === b.dataset.id);
    n.dueAt += 24 * 3600e3;
    persist();
    toast("⏰ یادآور به فردا موکول شد");
    renderNotifications();
  });
  const btnEnable = $("#btnEnableNotif");
  if (btnEnable) btnEnable.onclick = () => NotifEngine.requestPermission();
  $("#btnTestNotif").onclick = () => NotifEngine.fire("هوش گیاهی", "این یک پیام آزمایشی است — اعلان‌ها درست کار می‌کنند!", "test");
}

function completeNotification(id) {
  const n = State.notifications.find((x) => x.id === id);
  if (!n) return;
  n.done = true;
  gainXp(15);
  persist();
  celebrate();
  renderNotifications();
}

function celebrate() {
  const c = $("#celebration");
  c.innerHTML = `<div class="confetti-box"><div class="confetti-emoji">${ic("party","xl")}</div><p>آفرین! داری عالی از گیاهانت مراقبت می‌کنی</p></div>`;
  c.classList.remove("hidden");
  setTimeout(() => c.classList.add("hidden"), 7500);
}

function gainXp(n) {
  State.xp += n;
  $("#xpVal") && ($("#xpVal").textContent = State.xp);
  updateTrustLevel();
}

function updateTrustLevel() {
  const levels = [...State.db.trustLevels].sort((a, b) => b.minXp - a.minXp);
  const lvl = levels.find((l) => State.xp >= l.minXp);
  if (lvl && State.user) State.user.trust = lvl.id;
}

function renderFeed() {

function timeAgo(ts) {
  const min = Math.floor((Date.now() - ts) / 60000);
  if (min < 60) return `${min} دقیقه پیش`;
  return `${Math.floor(min / 60)} ساعت پیش`;
}

function applyCustomPersonalization() {
  const text = localStorage.getItem("hooshGiah.customText"); // "gray" | "black" | "white" | ""
  const gradient = localStorage.getItem("hooshGiah.customGradient"); // JSON stringified array of 2 hex colors
  const cleared = localStorage.getItem("hooshGiah.customGradientCleared") === "1"; // پس‌زمینه کاملاً سفید و خالی
  const size = localStorage.getItem("hooshGiah.customSize");
  const r = document.documentElement.style;

  // پیش‌نویس طیف رنگ (حتی اگر فقط رنگ اول انتخاب شده باشد) — برای مخفی کردن لکه‌های سبز تزئینی
  let draftHasColor = false;
  try {
    const draft = JSON.parse(localStorage.getItem("hooshGiah.customGradientDraft") || "[]");
    draftHasColor = Array.isArray(draft) && draft.length > 0 && !!draft[0];
  } catch (e) {}

  // پایه رنگی: تم فعلی
  const themeKey = localStorage.getItem("hooshGiah.theme") || "default";
  const t = THEMES[themeKey] || THEMES.default;

  const textColorMap = { gray: "#6b6f6d", black: "#1c1f1d", white: "#ffffff" };
  const finalInk = textColorMap[text] || t.ink;

  // طیف رنگ فقط روی پس‌زمینه‌ی اصلی صفحه (پشت برنامه) اعمال می‌شود؛ کارت‌ها دست‌نخورده می‌مانند
  let finalBg = t.bg;
  let bgImage = "none";

  if (cleared) {
    finalBg = "#ffffff";
    bgImage = "none";
  } else if (gradient) {
    try {
      const stops = JSON.parse(gradient);
      if (Array.isArray(stops) && stops.length >= 2) {
        // مورب: رنگ اول از بالا-راست، رنگ دوم از پایین-چپ، برخورد در وسط
        // رنگ پایه را هم روی رنگ اول می‌گذاریم تا هیچ لکه‌ی سبزی از زیر طیف دیده نشود
        finalBg = stops[0];
        bgImage = `linear-gradient(225deg, ${stops[0]} 0%, ${stops[0]} 45%, ${stops[1]} 55%, ${stops[1]} 100%)`;
      }
    } catch (e) {}
  } else if (draftHasColor) {
    // فقط رنگ اول انتخاب شده — پس‌زمینه یکدست همان رنگ، بدون لکه‌ی تزئینی سبز
    try {
      const draft = JSON.parse(localStorage.getItem("hooshGiah.customGradientDraft") || "[]");
      if (draft[0]) {
        finalBg = draft[0];
        bgImage = "none";
      }
    } catch (e) {}
  }

  r.setProperty("--bg", finalBg);
  r.setProperty("--bg-image", bgImage);
  r.setProperty("--ink", finalInk);
  r.setProperty("--surface", t.surface || "#ffffff");
  r.setProperty("--panel", t.panel || "#f6fbf3");
  r.setProperty("--cream", t.cream);
  r.setProperty("--leaf-1", t.leaf1);
  r.setProperty("--leaf-2", t.leaf2);
  r.setProperty("--leaf-3", t.leaf3);
  r.setProperty("--leaf-deep", t.leafDeep);
  r.setProperty("--sun", t.sun);
  r.setProperty("--muted", t.muted || "#6b7d6a");
  r.setProperty("--fine-bg", t.fineBg || "#fff7e0");

  if (text) document.body.classList.add("custom-text-active");
  else document.body.classList.remove("custom-text-active");

  document.body.classList.toggle("bg-fully-cleared", cleared);
  document.body.classList.toggle("custom-gradient-active", !!gradient && !cleared);
  document.body.classList.toggle("gradient-draft-active", draftHasColor && !gradient && !cleared);

  if (size) document.body.style.fontSize = (12 + Number(size)) + "px";
}

  r.setProperty("--bg", t.bg);
  r.setProperty("--leaf-1", t.leaf1);
  r.setProperty("--leaf-2", t.leaf2);

  if (metaTheme) metaTheme.setAttribute("content", t.bg);

}

async function openAdminGate() {
  if (State.adminAuthed) {
    goto("admin");
    return;
  }
  const pass = await showModal({
    title: "ورود به پنل ادمین",
    message: "رمز عبور ادمین را وارد کنید. این بخش از برنامهٔ کاربر جداست.",
    input: { type: "password", placeholder: "رمز ادمین" },
    confirmLabel: "ورود",
    cancelLabel: "انصراف",
  });
  if (pass === null) return;
  if (String(pass).trim() === ADMIN_PASSWORD) {
    State.adminAuthed = true;
    toast("وارد پنل ادمین شدید");
    goto("admin");
  } else {
    toast("رمز نادرست است");

          <p class="muted small" style="margin:0;">جلوه‌های ویژه مثل درخشش براق روی دکمه‌ها و نور ملایم چرخان دور صفحه رو فعال کن.</p>
        </div>
      </div>
    </section>
  `;
  $("#btnBackSettings").onclick = () => { State.settingsView = "menu"; renderSettings(); };
  $("#goCustom").onclick = () => { State.settingsView = "custom"; renderSettings(); };
  $("#goThemes").onclick = () => { State.settingsView = "themes"; renderSettings(); };
  $("#goAdvanced").onclick = () => { State.settingsView = "advanced"; renderSettings(); };
}

function renderCustomPersonalize() {
  const el = $("#view");
  const curText = localStorage.getItem("hooshGiah.customText") || "";
  const curSize = Number(localStorage.getItem("hooshGiah.customSize") || 4);
  const hasGradient = !!localStorage.getItem("hooshGiah.customGradient");

  const textOptions = [
    { key: "gray",  label: "خاکستری", swatch: "#6b6f6d" },
    { key: "black", label: "مشکی",    swatch: "#1c1f1d" },
    { key: "white", label: "سفید",    swatch: "#ffffff" },
  ];

  el.innerHTML = `
    <section class="card">
      <h2>${ic("star")} شخصی سازی سفارشی</h2>
      <button class="btn-mini" id="btnBackPersonalize" style="margin-bottom:10px;">${ic("cross")} بازگشت</button>

      <div class="ai-card" id="goGradientBuilder" style="cursor:pointer;">
        <h3 style="margin:0 0 4px;">${ic("leaf")} طیف رنگ</h3>
        <p class="muted small" style="margin:0;">پس‌زمینه‌ی پشت برنامه رو با دو رنگ دلخواه خودت بساز.${hasGradient ? " — " + ic("check") + " فعال" : ""}</p>
      </div>

      <h3 style="margin-top:18px;">${ic("brain")} رنگ متن</h3>
      <div style="display:flex; gap:10px; margin:8px 0 4px;">
        ${textOptions.map((o) => `
          <button data-text="${o.key}" class="btn-mini" style="flex:1; display:flex; align-items:center; justify-content:center; gap:6px; ${curText===o.key ? "outline:2px solid var(--leaf-deep);" : ""}">
            <span style="width:16px;height:16px;border-radius:50%;background:${o.swatch};display:inline-block;border:1px solid rgba(0,0,0,0.25);"></span>
            ${o.label}
          </button>
        `).join("")}
      </div>

      <h3>${ic("gear")} سایز متن</h3>
      <div style="display:flex; align-items:center; gap:10px; margin:8px 0;">
        <input id="sizeRange" type="range" min="0" max="20" step="1" value="${curSize}" style="flex:1;" />
        <b id="sizeVal" style="min-width:28px; text-align:center;">${curSize}</b>
      </div>
      <p class="muted small" id="sizePreview" style="font-size:${12 + curSize}px;">نمونه متن با این سایز</p>

      <button class="btn-primary" id="btnResetCustom" style="margin-top:10px;">${ic("cross")} بازگرداندن به حالت پیش‌فرض</button>
    </section>
  `;

  $("#btnBackPersonalize").onclick = () => { State.settingsView = "personalize"; renderSettings(); };
  $("#goGradientBuilder").onclick = () => { State.settingsView = "gradientBuilder"; renderSettings(); };

  const applyText = (val) => {
    localStorage.setItem("hooshGiah.customText", val);
    applyCustomPersonalization();
    toast("رنگ متن اعمال شد");
    renderCustomPersonalize();
  };
  $$("[data-text]").forEach((s) => s.onclick = () => applyText(s.dataset.text));

  const range = $("#sizeRange");
  range.addEventListener("input", () => {
    const v = range.value;
    $("#sizeVal").textContent = v;
    $("#sizePreview").style.fontSize = (12 + Number(v)) + "px";
  });
  range.addEventListener("change", () => {
    localStorage.setItem("hooshGiah.customSize", range.value);
    applyCustomPersonalization();
    toast("سایز متن اعمال شد");
  });
  $("#btnResetCustom").onclick = () => {
    localStorage.removeItem("hooshGiah.customText");
    localStorage.removeItem("hooshGiah.customSize");
    localStorage.removeItem("hooshGiah.customGradient");
    localStorage.removeItem("hooshGiah.customGradientDraft");
    localStorage.removeItem("hooshGiah.customGradientCleared");
    document.documentElement.style.removeProperty("--bg");
    document.documentElement.style.removeProperty("--bg-image");
    document.documentElement.style.removeProperty("--ink");
    document.documentElement.style.removeProperty("--surface");
    document.documentElement.style.removeProperty("--panel");
    document.documentElement.style.removeProperty("--cream");
    document.body.style.fontSize = "";
    document.body.classList.remove("custom-text-active");
    document.body.classList.remove("bg-fully-cleared");
    applyTheme(localStorage.getItem("hooshGiah.theme") || "default");
    toast("به حالت پیش‌فرض بازگشت");
    renderCustomPersonalize();
  };
}

function renderGradientBuilder() {
  const el = $("#view");
  let cur = [];
  try {
    cur = JSON.parse(
      localStorage.getItem("hooshGiah.customGradientDraft") ||
      localStorage.getItem("hooshGiah.customGradient") || "[]"
    );
  } catch (e) {}
  // همیشه ترتیب ثابت: ایندکس 0 = رنگ اول، ایندکس 1 = رنگ دوم
  const c1 = (Array.isArray(cur) && cur[0]) ? cur[0] : "";
  const c2 = (Array.isArray(cur) && cur[1]) ? cur[1] : "";
  const pageHidden = State.gradientPreviewHideChrome === true;
  const hasGradient = !!(c1 && c2);

  const swatchRow = (label, attr, current, disabled = false) => `
    <h3 style="margin-top:16px;">${label}</h3>
    <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:8px 0 4px;${disabled ? "opacity:.45;pointer-events:none;" : ""}">
      ${PASTEL_25.map((hex) => `
        <button type="button" data-color-slot="${attr}" data-hex="${hex}" aria-label="${hex}"
          style="width:100%;aspect-ratio:1;border-radius:10px;background:${hex};cursor:${disabled ? "not-allowed" : "pointer"};border:${current===hex ? "3px solid var(--leaf-deep)" : "2px solid rgba(0,0,0,0.12)"};padding:0;">
        </button>
      `).join("")}
    </div>`;

  el.innerHTML = `
    <section class="card" style="${pageHidden ? "background:transparent;border:none;box-shadow:none;" : ""}">
      <h2>${ic("leaf")} طیف رنگ دو‌رنگه</h2>
      <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
        <button class="btn-mini" id="btnBackGradient">${ic("cross")} بازگشت</button>
        <button class="btn-mini" id="btnHideChrome">${pageHidden ? ic("check") + " نمایش دوباره‌ی صفحه" : ic("cross") + " حذف صفحه (پیش‌نمایش)"}</button>
        <button class="btn-mini" id="btnClearGradient">${ic("cross")} حذف کلی طیف رنگ</button>
      </div>
      <p class="muted small">
        <b>مرحله ۱:</b> اول رنگ اول را انتخاب کن.
        <b>مرحله ۲:</b> بعد از انتخاب رنگ اول، رنگ دوم فعال می‌شود.
        با انتخاب هر دو رنگ، طیف فوراً روی پس‌زمینه اعمال می‌شود و لکه‌های سبز تزئینی حذف می‌شوند.
      </p>
      <div style="height:60px;border-radius:14px;margin:12px 0;border:1px solid rgba(0,0,0,.1);background:${hasGradient ? `linear-gradient(225deg, ${c1} 0%, ${c1} 45%, ${c2} 55%, ${c2} 100%)` : c1 ? c1 : "repeating-linear-gradient(45deg,#eee,#eee 10px,#f7f7f7 10px,#f7f7f7 20px)"};"></div>
      <div class="fine">${c1 ? `${ic("check")} رنگ اول: <b>${c1}</b>${c2 ? " — رنگ دوم: <b>" + c2 + "</b>" : " — حالا رنگ دوم را انتخاب کن"}` : `${ic("leaf")} هنوز رنگ اول انتخاب نشده است. اول از بخش «۱) رنگ اول» شروع کن.`}</div>
      ${swatchRow(ic("leaf") + " ۱) رنگ اول (بالا-راست) — اول این را انتخاب کن", "c1", c1, false)}
      ${swatchRow(ic("leaf") + " ۲) رنگ دوم (پایین-چپ) — بعد از رنگ اول", "c2", c2, !c1)}
    </section>
  `;

  document.body.classList.toggle("gradient-preview-hide-chrome", pageHidden);

  $("#btnBackGradient").onclick = () => {
    document.body.classList.remove("gradient-preview-hide-chrome");
    State.settingsView = "custom";
    renderSettings();
  };
  $("#btnHideChrome").onclick = () => {
    State.gradientPreviewHideChrome = !pageHidden;
    renderGradientBuilder();
  };
  $("#btnClearGradient").onclick = () => {
    localStorage.removeItem("hooshGiah.customGradient");
    localStorage.removeItem("hooshGiah.customGradientDraft");
    localStorage.setItem("hooshGiah.customGradientCleared", "1");
    applyCustomPersonalization();
    toast("پس‌زمینه کاملاً سفید و خالی شد");
    renderGradientBuilder();
  };

  const saveDraft = (next) => {
    // next همیشه [رنگ‌اول, رنگ‌دوم]
    localStorage.removeItem("hooshGiah.customGradientCleared");
    localStorage.setItem("hooshGiah.customGradientDraft", JSON.stringify(next));
    if (next[0] && next[1]) {
      localStorage.setItem("hooshGiah.customGradient", JSON.stringify(next));
      applyCustomPersonalization();
      toast("طیف رنگ اعمال شد");
    } else if (next[0]) {
      localStorage.removeItem("hooshGiah.customGradient");
      applyCustomPersonalization();
      toast("رنگ اول انتخاب شد؛ حالا رنگ دوم را انتخاب کن");
    }
    renderGradientBuilder();
  };

  // انتخاب فقط از طریق data-color-slot تا ترتیب ۱→۲ همیشه حفظ شود
  $$("[data-color-slot]").forEach((swatch) => {
    swatch.onclick = () => {
      const slot = swatch.getAttribute("data-color-slot");
      const hex = swatch.getAttribute("data-hex");
      if (slot === "c1") {
        // انتخاب رنگ اول؛ رنگ دوم قبلی حفظ می‌شود (اگر باشد)
        saveDraft([hex, c2]);
      } else if (slot === "c2") {
        if (!c1) {
          toast("اول رنگ اول را انتخاب کن");
          return;
        }
        saveDraft([c1, hex]);
      }
    };
  });
}

function renderReadyThemes() {

  el.innerHTML = `
    <section class="card">
      <h2>${ic("leaf")} تم های آماده</h2>
      <button class="btn-mini" id="btnBackThemes" style="margin-bottom:10px;">${ic("cross")} بازگشت</button>
      <p class="muted small">یک تم رنگی برای برنامه انتخاب کنید</p>
      <div class="admin-list" id="themeList">
        ${Object.entries(THEMES).map(([key, t]) => `
          <div class="admin-row" data-theme="${key}" style="cursor:pointer; align-items:center; ${current===key ? "outline:2px solid "+t.leafDeep+";" : ""}">
            <span style="display:flex; align-items:center; gap:8px;">
              <span style="width:18px;height:18px;border-radius:50%;background:${t.leaf3};display:inline-block;border:2px solid ${t.leafDeep};"></span>
              ${t.name}
            </span>
            <b>${current === key ? ic("check") + " فعال" : ""}</b>
          </div>
        `).join("")}
      </div>
    </section>
  `;
  $("#btnBackThemes").onclick = () => { State.settingsView = "personalize"; renderSettings(); };
  $$("#themeList [data-theme]").forEach((row) => {
    row.onclick = () => {
      const key = row.dataset.theme;
      localStorage.setItem("hooshGiah.theme", key);
      // تم آماده رنگ‌های سفارشی صفحه/متن را بازنشانی می‌کند تا با هم تداخل نکنند
      localStorage.removeItem("hooshGiah.customGradient");
      localStorage.removeItem("hooshGiah.customGradientDraft");
      localStorage.removeItem("hooshGiah.customGradientCleared");
      localStorage.removeItem("hooshGiah.customText");
      document.documentElement.style.removeProperty("--bg");
      document.documentElement.style.removeProperty("--bg-image");
      document.documentElement.style.removeProperty("--ink");
      document.documentElement.style.removeProperty("--surface");
      document.documentElement.style.removeProperty("--panel");
      document.documentElement.style.removeProperty("--cream");
      document.body.classList.remove("custom-text-active");
      applyTheme(key);
      applyCustomPersonalization();
      toast("تم اعمال شد");
      renderReadyThemes();
    };
  });
}

// شخصی‌سازی‌های پیشرفته (براق و نور چرخان) رو از localStorage می‌خونه و روی body اعمال می‌کنه
function applyAdvancedPersonalization() {
  const glossy = localStorage.getItem("hooshGiah.glossy") === "1";
  const glow = localStorage.getItem("hooshGiah.glowFrame") === "1";
  document.body.classList.toggle("glossy-mode", glossy);
  document.body.classList.toggle("glow-frame-mode", glow);

  const shineSpeed = localStorage.getItem("hooshGiah.shineSpeed") || "3.4";
  document.documentElement.style.setProperty("--shine-duration", shineSpeed + "s");

  const glowColor = localStorage.getItem("hooshGiah.glowColor") || "";
  const glowSpeed = localStorage.getItem("hooshGiah.glowSpeed") || "7";
  if (glowColor) {
    document.documentElement.style.setProperty("--glow-color", glowColor);
    document.documentElement.style.setProperty("--glow-color-deep", glowColor);
  } else {
    document.documentElement.style.removeProperty("--glow-color");
    document.documentElement.style.removeProperty("--glow-color-deep");
  }
  document.documentElement.style.setProperty("--glow-duration", glowSpeed + "s");
}

function renderAdvancedPersonalize() {
  const el = $("#view");
  const isGlossy = localStorage.getItem("hooshGiah.glossy") === "1";
  const isGlow = localStorage.getItem("hooshGiah.glowFrame") === "1";
  const glowSpeed = localStorage.getItem("hooshGiah.glowSpeed") || "7";
  const glowColor = localStorage.getItem("hooshGiah.glowColor") || "#4f9d6e";
  const shineSpeed = localStorage.getItem("hooshGiah.shineSpeed") || "3.4";
  el.innerHTML = `
    <section class="card">
      <h2>${ic("star")} شخصی‌سازی‌های پیشرفته</h2>
      <button class="btn-mini" id="btnBackAdvanced" style="margin-bottom:10px;">${ic("cross")} بازگشت</button>
      <div style="display:grid; gap:14px;">
        <div class="ai-card" id="glossyToggle" style="cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:10px;">
          <div>
            <h3 style="margin:0 0 4px;">${ic("star")} شخصی‌سازی براق</h3>
            <p class="muted small" style="margin:0;">دکمه‌های اصلی برنامه — مثل «افزودن عکس»، «افزودن صدا» توی بخش هوش گیاهی و بقیه دکمه‌ها و آیتم‌های ریز توی قسمت‌های دیگه — رو مثل یک سطح براق و آینه‌ای می‌کنه که هر چند لحظه یک برق روشون رد می‌شه.</p>
          </div>
          <b style="white-space:nowrap;">${isGlossy ? ic("check") + " فعال" : "فعال‌سازی"}</b>
        </div>
        ${isGlossy ? `
        <div class="ai-card" style="display:grid; gap:8px;">
          <h3 style="margin:0 0 8px;">${ic("star")} سرعت براق‌شدن</h3>
          <input type="range" id="shineSpeedRange" min="1" max="8" step="0.2" value="${shineSpeed}" style="width:100%;" />
          <p class="muted small" style="margin:0;" id="shineSpeedLabel">هر چقدر عدد کمتر باشه، برق روی دکمه‌ها سریع‌تر رد می‌شه — الان: هر ${shineSpeed} ثانیه یک بار</p>
        </div>
        ` : ""}
        <div class="ai-card" id="glowFrameToggle" style="cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:10px;">
          <div>
            <h3 style="margin:0 0 4px;">${ic("sun")} نور چرخان دور صفحه</h3>
            <p class="muted small" style="margin:0;">یک نوار نور نازک و ملایم، هم‌رنگ با تم یا رنگ‌های سفارشی خودت، آروم دور تا دور لبه‌های صفحه می‌چرخه؛ کاملاً محو و بدون مزاحمت برای چشمه.</p>
          </div>
          <b style="white-space:nowrap;">${isGlow ? ic("check") + " فعال" : "فعال‌سازی"}</b>
        </div>
        ${isGlow ? `
        <div class="ai-card" style="display:grid; gap:16px;">
          <div>
            <h3 style="margin:0 0 8px;">${ic("sun")} سرعت چرخش نور</h3>
            <input type="range" id="glowSpeedRange" min="2" max="20" step="1" value="${glowSpeed}" style="width:100%;" />
            <p class="muted small" style="margin:6px 0 0;" id="glowSpeedLabel">هر چقدر عدد کمتر باشه سریع‌تر می‌چرخه — الان: ${glowSpeed} ثانیه برای هر دور کامل</p>
          </div>
          <div>
            <h3 style="margin:0 0 8px;">${ic("star")} رنگ نور چرخان</h3>
            <div class="color-picker-row">
              <input type="color" id="glowColorPicker" value="${glowColor}" />
              <span class="muted small">رنگ دلخواهت رو انتخاب کن</span>
              <button class="btn-mini ghost" id="btnResetGlowColor">پیش‌فرض</button>
            </div>
          </div>
        </div>
        ` : ""}
      </div>
    </section>

  $("#btnBackAdvanced").onclick = () => { State.settingsView = "personalize"; renderSettings(); };
  $("#glossyToggle").onclick = () => {
    const next = isGlossy ? "" : "1";
    if (next) localStorage.setItem("hooshGiah.glossy", "1");
    else localStorage.removeItem("hooshGiah.glossy");
    applyAdvancedPersonalization();
    toast(next ? "شخصی‌سازی براق فعال شد" : "شخصی‌سازی براق غیرفعال شد");
    renderAdvancedPersonalize();
  };
  $("#glowFrameToggle").onclick = () => {
    const next = isGlow ? "" : "1";
    if (next) localStorage.setItem("hooshGiah.glowFrame", "1");
    else localStorage.removeItem("hooshGiah.glowFrame");
    applyAdvancedPersonalization();
    toast(next ? "نور چرخان فعال شد" : "نور چرخان غیرفعال شد");
    renderAdvancedPersonalize();
  };
  const speedRange = $("#glowSpeedRange");
  if (speedRange) {
    speedRange.oninput = () => {
      const v = speedRange.value;
      localStorage.setItem("hooshGiah.glowSpeed", v);
      applyAdvancedPersonalization();
      const label = $("#glowSpeedLabel");
      if (label) label.textContent = `هر چقدر عدد کمتر باشه سریع‌تر می‌چرخه — الان: ${v} ثانیه برای هر دور کامل`;
    };
  }
  const shineRange = $("#shineSpeedRange");
  if (shineRange) {
    shineRange.oninput = () => {
      const v = shineRange.value;
      localStorage.setItem("hooshGiah.shineSpeed", v);
      applyAdvancedPersonalization();
      const label = $("#shineSpeedLabel");
      if (label) label.textContent = `هر چقدر عدد کمتر باشه، برق روی دکمه‌ها سریع‌تر رد می‌شه — الان: هر ${v} ثانیه یک بار`;
    };
  }
  const colorPicker = $("#glowColorPicker");
  if (colorPicker) {
    colorPicker.oninput = () => {
      localStorage.setItem("hooshGiah.glowColor", colorPicker.value);
      applyAdvancedPersonalization();
    };
  }
  const resetColorBtn = $("#btnResetGlowColor");
  if (resetColorBtn) {
    resetColorBtn.onclick = () => {
      localStorage.removeItem("hooshGiah.glowColor");
      applyAdvancedPersonalization();
      toast("رنگ پیش‌فرض برگشت");
      renderAdvancedPersonalize();
    };
  }
}

/* ---------------- تنظیمات هوش مصنوعی ---------------- */
function renderAiSettings() {
  const el = $("#view");
  el.innerHTML = `
    <section class="card">
      <h2>${ic("brain")} تنظیمات هوش مصنوعی</h2>
      <button class="btn-mini" id="btnBackAiSettings" style="margin-bottom:10px;">${ic("cross")} بازگشت</button>
      <p class="muted small" style="margin:0 0 12px;">دستیار «هوش گیاهی» برای پاسخ به سوالات و شناسایی گیاه از روی عکس، از سرویس OpenRouter استفاده می‌کنه.</p>

      <div class="ai-card" style="display:grid; gap:10px;">
        <button class="btn-mini" id="btnTestAiKey">${ic("search")} تست اتصال</button>
        <p class="muted small" id="aiKeyStatus" style="margin:0; word-break:break-word;">دستیار با کلید داخلی برنامه فعاله.</p>
      </div>

      <div class="fine" style="margin-top:14px; line-height:1.9;">
        ${ic("info")} اگر تست اتصال با خطا مواجه شد، پیام خطا همینجا نشون داده می‌شه.
      </div>
    </section>
  `;
  $("#btnBackAiSettings").onclick = () => { State.settingsView = "menu"; renderSettings(); };
  $("#btnTestAiKey").onclick = async () => {
    const btn = $("#btnTestAiKey");
    const status = $("#aiKeyStatus");
    btn.disabled = true;
    status.innerHTML = `${ic("search")} در حال تست اتصال...`;
    try {
      await aiChatCompletion([{ role: "user", content: "سلام" }]);
      status.innerHTML = `${ic("check")} اتصال با موفقیت برقرار شد!`;
    } catch (e) {
      status.innerHTML = `${ic("warning")} ${escapeHtml(e.message || "اتصال برقرار نشد.")}`;
    } finally {
      btn.disabled = false;
    }
  };
}
