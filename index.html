<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#2f6b47" />
<link rel="manifest" href="./manifest.webmanifest" />
<title>گیاه‌یار</title>
<style>
  :root {
    --primary: #2f6b47;
    --primary-light: #4a9c6a;
    --primary-dark: #1e4a30;
    --accent: #f0a500;
    --bg: #f5f9f6;
    --card-bg: #ffffff;
    --text: #1a2e22;
    --text-secondary: #5a7a65;
    --border: #c8e0d0;
    --shadow: rgba(47,107,71,0.15);
    --footer-bg: #2f6b47;
    --footer-text: #ffffff;
    --glossy: 0;
    --border-anim: 0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* ===== ANIMATED BORDER ===== */
  .border-anim-container {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 9999;
  }
  .border-anim-container.active { display: block; }

  .border-anim-line {
    position: absolute;
    background: linear-gradient(90deg, transparent, var(--primary-light), transparent);
    opacity: 0.5;
  }
  .border-top {
    top: 0; left: 0;
    width: 100%; height: 3px;
    animation: moveRight 3s linear infinite;
    background: linear-gradient(90deg, transparent, var(--accent), var(--primary-light), transparent);
  }
  .border-bottom {
    bottom: 0; left: 0;
    width: 100%; height: 3px;
    animation: moveLeft 3s linear infinite;
    background: linear-gradient(90deg, transparent, var(--primary-light), var(--accent), transparent);
  }
  .border-left {
    top: 0; left: 0;
    width: 3px; height: 100%;
    animation: moveDown 3s linear infinite;
    background: linear-gradient(180deg, transparent, var(--accent), var(--primary-light), transparent);
  }
  .border-right {
    top: 0; right: 0;
    width: 3px; height: 100%;
    animation: moveUp 3s linear infinite;
    background: linear-gradient(180deg, transparent, var(--primary-light), var(--accent), transparent);
  }

  @keyframes moveRight {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  @keyframes moveLeft {
    0% { transform: translateX(100%); }
    100% { transform: translateX(-100%); }
  }
  @keyframes moveDown {
    0% { transform: translateY(-100%); }
    100% { transform: translateY(100%); }
  }
  @keyframes moveUp {
    0% { transform: translateY(100%); }
    100% { transform: translateY(-100%); }
  }

  /* ===== GLOSSY EFFECT ===== */
  .glossy-item {
    position: relative;
    overflow: hidden;
  }
  .glossy-item::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: linear-gradient(
      45deg,
      transparent 30%,
      rgba(255,255,255,0.4) 50%,
      transparent 70%
    );
    animation: glossy-shine 2.5s ease-in-out infinite;
    opacity: 0;
    pointer-events: none;
    z-index: 1;
  }
  .glossy-active.glossy-item::before { opacity: 1; }

  @keyframes glossy-shine {
    0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
    50% { transform: translateX(100%) translateY(100%) rotate(45deg); }
    100% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
  }

  /* ===== HEADER ===== */
  .header {
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    color: white;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 10px var(--shadow);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-title {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .header-subtitle {
    font-size: 0.65rem;
    opacity: 0.85;
    margin-top: 1px;
  }
  .header-icon {
    font-size: 1.6rem;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
  }
  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .header-btn {
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    color: white;
    border-radius: 8px;
    padding: 5px 8px;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .header-btn:hover { background: rgba(255,255,255,0.35); }

  /* ===== MAIN CONTENT ===== */
  .main-content {
    flex: 1;
    padding: 10px 12px;
    max-width: 500px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 70px;
  }

  /* ===== CARDS ===== */
  .card {
    background: var(--card-bg);
    border-radius: 14px;
    padding: 12px;
    box-shadow: 0 2px 10px var(--shadow);
    border: 1px solid var(--border);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .card:hover { transform: translateY(-1px); box-shadow: 0 4px 16px var(--shadow); }

  .card-title {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ===== WEATHER WIDGET ===== */
  .weather-widget {
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: white;
    border-radius: 14px;
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 3px 12px var(--shadow);
  }
  .weather-temp { font-size: 1.8rem; font-weight: 700; }
  .weather-desc { font-size: 0.7rem; opacity: 0.9; }
  .weather-icon { font-size: 2.2rem; }
  .weather-details { display: flex; gap: 10px; }
  .weather-detail { text-align: center; }
  .weather-detail-val { font-size: 0.85rem; font-weight: 600; }
  .weather-detail-lbl { font-size: 0.6rem; opacity: 0.8; }

  /* ===== QUICK ACTIONS ===== */
  .quick-actions {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .quick-btn {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    box-shadow: 0 1px 6px var(--shadow);
  }
  .quick-btn:hover { background: var(--primary); color: white; transform: translateY(-2px); }
  .quick-btn:hover .quick-btn-icon { filter: none; }
  .quick-btn-icon { font-size: 1.3rem; }
  .quick-btn-label { font-size: 0.6rem; color: var(--text-secondary); font-weight: 600; }
  .quick-btn:hover .quick-btn-label { color: rgba(255,255,255,0.9); }

  /* ===== PLANT CARDS ===== */
  .plants-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .plant-card {
    background: var(--card-bg);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 2px 8px var(--shadow);
    cursor: pointer;
    transition: transform 0.2s;
  }
  .plant-card:hover { transform: scale(1.02); }
  .plant-card-img {
    width: 100%;
    height: 70px;
    object-fit: cover;
    background: linear-gradient(135deg, var(--primary-light), var(--accent));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
  }
  .plant-card-body { padding: 6px 8px; }
  .plant-card-name { font-size: 0.75rem; font-weight: 700; color: var(--text); }
  .plant-card-status { font-size: 0.6rem; color: var(--text-secondary); margin-top: 2px; }
  .plant-health {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 4px;
  }
  .health-bar {
    flex: 1;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .health-fill {
    height: 100%;
    background: linear-gradient(90deg, #4caf50, #8bc34a);
    border-radius: 2px;
  }
  .health-pct { font-size: 0.6rem; color: var(--primary); font-weight: 600; }

  /* ===== SECTION HEADER ===== */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .section-title {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--primary-dark);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .see-all {
    font-size: 0.65rem;
    color: var(--primary-light);
    cursor: pointer;
    text-decoration: underline;
  }

  /* ===== TASKS ===== */
  .task-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .task-item:last-child { border-bottom: none; }
  .task-icon { font-size: 1rem; }
  .task-text { flex: 1; font-size: 0.72rem; color: var(--text); }
  .task-time { font-size: 0.6rem; color: var(--text-secondary); }
  .task-check {
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .task-check.done { background: var(--primary); border-color: var(--primary); }
  .task-check.done::after { content: '✓'; color: white; font-size: 0.7rem; }

  /* ===== TIP CARD ===== */
  .tip-card {
    background: linear-gradient(135deg, #fff9e6, #fff3cc);
    border: 1px solid #f0c040;
    border-radius: 12px;
    padding: 10px 12px;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .tip-icon { font-size: 1.3rem; }
  .tip-title { font-size: 0.72rem; font-weight: 700; color: #b87000; margin-bottom: 3px; }
  .tip-text { font-size: 0.65rem; color: #8a6000; line-height: 1.5; }

  /* ===== BOTTOM NAVIGATION ===== */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--footer-bg);
    display: flex;
    justify-content: space-around;
    align-items: stretch;
    padding: 0;
    box-shadow: 0 -2px 12px var(--shadow);
    z-index: 200;
    height: 56px;
  }
  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 4px 2px;
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.65);
    font-family: inherit;
    transition: all 0.2s;
    gap: 2px;
    min-width: 0;
  }
  .nav-item.active {
    color: white;
    background: rgba(255,255,255,0.15);
    border-top: 2px solid var(--accent);
  }
  .nav-item:hover { color: white; background: rgba(255,255,255,0.1); }
  .nav-icon { font-size: 1.15rem; line-height: 1; }
  .nav-label { font-size: 0.52rem; font-weight: 600; white-space: nowrap; line-height: 1; }

  /* ===== PANELS ===== */
  .panel {
    display: none;
    flex-direction: column;
    flex: 1;
  }
  .panel.active { display: flex; }

  /* ===== AI PANEL (هوش گیاهی) ===== */
  .ai-panel-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 12px;
    gap: 10px;
    padding-bottom: 70px;
  }
  .ai-panel-title {
    text-align: center;
    padding: 16px 12px;
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    color: white;
    border-radius: 14px;
    box-shadow: 0 3px 12px var(--shadow);
  }
  .ai-panel-title h2 { font-size: 1rem; margin-bottom: 4px; }
  .ai-panel-title p { font-size: 0.7rem; opacity: 0.85; }

  .ai-chat-area {
    flex: 1;
    background: var(--card-bg);
    border-radius: 14px;
    border: 1px solid var(--border);
    padding: 12px;
    overflow-y: auto;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .ai-welcome {
    text-align: center;
    color: var(--text-secondary);
    padding: 20px;
  }
  .ai-welcome-icon { font-size: 2.5rem; margin-bottom: 8px; }
  .ai-welcome p { font-size: 0.75rem; line-height: 1.6; }

  .chat-bubble {
    max-width: 85%;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 0.75rem;
    line-height: 1.5;
  }
  .chat-bubble.user {
    background: var(--primary);
    color: white;
    align-self: flex-start;
    border-bottom-right-radius: 4px;
  }
  .chat-bubble.ai {
    background: #f0f4f1;
    color: var(--text);
    align-self: flex-end;
    border-bottom-left-radius: 4px;
    border: 1px solid var(--border);
  }

  /* AI Bottom Input Area */
  .ai-input-area {
    background: var(--card-bg);
    border-radius: 14px;
    border: 1px solid var(--border);
    padding: 10px;
    box-shadow: 0 2px 10px var(--shadow);
  }
  .ai-input-label {
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 6px;
    text-align: center;
  }
  .ai-input-row {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-bottom: 8px;
  }
  .ai-text-input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-family: inherit;
    font-size: 0.75rem;
    color: var(--text);
    background: var(--bg);
    outline: none;
    resize: none;
  }
  .ai-text-input:focus { border-color: var(--primary); }
  .ai-send-btn {
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 7px 12px;
    font-family: inherit;
    font-size: 0.75rem;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .ai-send-btn:hover { background: var(--primary-dark); }
  .ai-media-btns {
    display: flex;
    gap: 8px;
  }
  .ai-media-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 7px;
    border-radius: 10px;
    border: 1.5px dashed var(--border);
    background: var(--bg);
    cursor: pointer;
    font-family: inherit;
    font-size: 0.7rem;
    color: var(--text-secondary);
    transition: all 0.2s;
  }
  .ai-media-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: rgba(47,107,71,0.05);
  }
  .ai-media-btn.glossy-item { overflow: hidden; }

  /* ===== SETTINGS PANEL ===== */
  .settings-content {
    flex: 1;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 70px;
    overflow-y: auto;
  }
  .settings-section {
    background: var(--card-bg);
    border-radius: 14px;
    border: 1px solid var(--border);
    overflow: hidden;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .settings-section-title {
    padding: 8px 12px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: white;
    font-size: 0.78rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .settings-item {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .settings-item:last-child { border-bottom: none; }
  .settings-item-info { flex: 1; min-width: 0; }
  .settings-item-title { font-size: 0.75rem; font-weight: 600; color: var(--text); }
  .settings-item-desc { font-size: 0.6rem; color: var(--text-secondary); margin-top: 2px; line-height: 1.4; }

  /* Toggle Switch */
  .toggle-switch {
    position: relative;
    width: 38px;
    height: 20px;
    flex-shrink: 0;
  }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #ccc;
    border-radius: 20px;
    transition: 0.3s;
  }
  .toggle-slider::before {
    content: '';
    position: absolute;
    height: 14px; width: 14px;
    right: 3px; bottom: 3px;
    background: white;
    border-radius: 50%;
    transition: 0.3s;
  }
  .toggle-switch input:checked + .toggle-slider { background: var(--primary); }
  .toggle-switch input:checked + .toggle-slider::before { transform: translateX(-18px); }

  /* Color Themes */
  .theme-options {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .theme-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .theme-btn.active { border-color: var(--text); transform: scale(1.15); }
  .theme-btn::after {
    content: '✓';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 0.7rem;
    opacity: 0;
  }
  .theme-btn.active::after { opacity: 1; }

  /* Preset Options */
  .preset-options {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .preset-btn {
    padding: 5px 10px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    font-family: inherit;
    font-size: 0.65rem;
    cursor: pointer;
    color: var(--text);
    transition: all 0.2s;
  }
  .preset-btn.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }

  /* Advanced options */
  .advanced-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    padding: 8px 12px;
    border: none;
    background: transparent;
    text-align: right;
    font-family: inherit;
    cursor: pointer;
    color: var(--text);
    transition: background 0.2s;
    border-bottom: 1px solid var(--border);
  }
  .advanced-btn:last-child { border-bottom: none; }
  .advanced-btn:hover { background: rgba(47,107,71,0.05); }
  .advanced-btn-icon { font-size: 1rem; }
  .advanced-btn-info { flex: 1; text-align: right; }
  .advanced-btn-title { font-size: 0.75rem; font-weight: 600; }
  .advanced-btn-desc { font-size: 0.6rem; color: var(--text-secondary); margin-top: 1px; }
  .advanced-btn-arrow { color: var(--text-secondary); font-size: 0.8rem; }

  /* API Key input */
  .api-key-input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-family: inherit;
    font-size: 0.72rem;
    color: var(--text);
    background: var(--bg);
    outline: none;
    direction: ltr;
  }
  .api-key-input:focus { border-color: var(--primary); }
  .save-btn {
    margin-top: 6px;
    width: 100%;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 7px;
    font-family: inherit;
    font-size: 0.75rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  .save-btn:hover { background: var(--primary-dark); }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    justify-content: center;
    align-items: flex-end;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--card-bg);
    border-radius: 20px 20px 0 0;
    padding: 16px;
    width: 100%;
    max-width: 500px;
    max-height: 80vh;
    overflow-y: auto;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .modal-title { font-size: 0.9rem; font-weight: 700; color: var(--primary); }
  .modal-close {
    background: #f0f4f1;
    border: none;
    border-radius: 50%;
    width: 28px; height: 28px;
    cursor: pointer;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ===== STATS ===== */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .stat-card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 10px 8px;
    text-align: center;
    border: 1px solid var(--border);
    box-shadow: 0 2px 6px var(--shadow);
  }
  .stat-val { font-size: 1.3rem; font-weight: 700; color: var(--primary); }
  .stat-lbl { font-size: 0.6rem; color: var(--text-secondary
